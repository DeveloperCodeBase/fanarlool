# FanarLool dedicated static host; managed from DeveloperCodeBase/fanarlool.
server {
    listen 8080;
    server_name fanarlool.vistapower.ir;
    root /var/www/fanarlool/current/dist;
    index index.html;
    autoindex off;
    access_log /var/log/nginx/fanarlool.access.log;
    error_log /var/log/nginx/fanarlool.error.log;

    location /api/ {
        allow 172.18.0.0/16;
        allow 127.0.0.1;
        deny all;
        proxy_pass http://unix:/run/fanarlool/api.sock:;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_forwarded_for;
        proxy_read_timeout 20s;
        client_max_body_size 32k;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ~ /\. { deny all; }
}
