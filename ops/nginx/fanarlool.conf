# FanarLool dedicated static host; managed from DeveloperCodeBase/fanarlool.
server {
    listen 8080;
    server_name fanarlool.vistapower.ir;
    root /var/www/fanarlool/current/dist;
    index index.html;
    autoindex off;
    access_log /var/log/nginx/fanarlool.access.log;
    error_log /var/log/nginx/fanarlool.error.log;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ~ /\. { deny all; }
}
